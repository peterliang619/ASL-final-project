<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Pages Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ECE7E5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #svg-display {
            width: 90vw;
            height: 90vh;
            max-width: 2075px;
            max-height: 1117px;
        }

        .restart-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 18px 40px;
            background-color: #252525;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .restart-btn:hover {
            background-color: #444;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #252525;
            font-size: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading...</div>
    <div id="svg-display"></div>
    <button class="restart-btn" onclick="location.reload()">↻ Restart</button>

    <script>
        // Load the SVG file
        fetch('asl-pages.svg')
            .then(response => response.text())
            .then(svgContent => {
                document.getElementById('loading').style.display = 'none';

                // Insert SVG into the page
                const container = document.getElementById('svg-display');
                container.innerHTML = svgContent;

                // Get the SVG element
                const svg = container.querySelector('svg');

                if (svg) {
                    // Set initial viewBox to show Frame 1
                    svg.setAttribute('viewBox', '0 0 2075 1117');
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

                    // Animate to Frame 2 after 2.5 seconds
                    setTimeout(() => {
                        animateViewBox(svg, 0, 1313, 2000); // 2 second transition
                    }, 2500);
                }
            })
            .catch(error => {
                console.error('Error loading SVG:', error);
                document.getElementById('loading').textContent = 'Error loading SVG';
            });

        // Smooth viewBox animation function
        function animateViewBox(svg, startY, endY, duration) {
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing function for smooth animation
                const easeProgress = progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                const currentY = startY + (endY - startY) * easeProgress;
                svg.setAttribute('viewBox', `0 ${currentY} 2075 1117`);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }
    </script>
</body>
</html>
