<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL SIGN Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ECE7E5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .animation-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SIGN Text Growing */
        .sign-letters {
            position: absolute;
            text-align: center;
            transform: scale(0.5);
            opacity: 0;
            animation: growLetters 2.5s ease-out forwards;
        }

        .sign-letters h1 {
            font-size: 150px;
            font-weight: 900;
            color: #252525;
            letter-spacing: 15px;
            margin: 0;
        }

        @keyframes growLetters {
            0% {
                transform: scale(0.5);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.8);
                opacity: 1;
            }
        }

        /* Character Groups Container */
        .characters-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 50px;
        }

        .character-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(-300px);
        }

        /* Blue Hand */
        .character-box.blue {
            animation: dropDown 0.9s ease-out 3s forwards;
        }

        /* Purple Hand */
        .character-box.purple {
            animation: dropDown 0.9s ease-out 3.5s forwards;
        }

        /* Orange Hand */
        .character-box.orange {
            animation: dropDown 0.9s ease-out 4s forwards;
        }

        @keyframes dropDown {
            0% {
                transform: translateY(-300px);
                opacity: 0;
            }
            70% {
                transform: translateY(20px);
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Hand SVG Shapes */
        .hand {
            width: 250px;
            height: 300px;
        }

        .hand-shape {
            stroke-width: 3;
        }

        .face {
            fill: #D9D9D9;
        }

        .eye {
            fill: #252525;
        }

        .mouth {
            stroke: #252525;
            stroke-width: 8;
            stroke-linecap: round;
            fill: none;
        }

        /* Restart Button */
        .restart-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 18px 40px;
            background-color: #252525;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .restart-btn:hover {
            background-color: #444;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .restart-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="animation-stage">
        <!-- Frame 1: SIGN Letters -->
        <div class="sign-letters">
            <h1>SIGN</h1>
        </div>

        <!-- Frame 2: Three Character Groups -->
        <div class="characters-container">
            <!-- Blue Hand Character -->
            <div class="character-box blue">
                <svg class="hand" viewBox="0 0 400 500">
                    <!-- Hand shape -->
                    <path class="hand-shape" d="M 80 350 L 80 200 C 80 180, 100 160, 180 165 C 200 165, 210 180, 210 200 L 210 220 C 210 220, 215 195, 220 180 C 225 165, 245 155, 270 160 C 290 165, 295 180, 295 200 L 285 260 C 350 260, 370 310, 365 350 C 360 400, 320 430, 280 440 L 150 440 C 110 430, 85 390, 80 350 Z"
                          fill="#8FB1F3" stroke="#91B1F5"/>
                    <!-- Face -->
                    <circle class="face" cx="160" cy="300" r="50"/>
                    <!-- Eyes -->
                    <circle class="eye" cx="145" cy="295" r="12"/>
                    <circle class="eye" cx="175" cy="295" r="12"/>
                    <!-- Smile -->
                    <path class="mouth" d="M 135 320 Q 160 335, 185 320"/>
                </svg>
            </div>

            <!-- Purple Hand Character -->
            <div class="character-box purple">
                <svg class="hand" viewBox="0 0 400 500">
                    <!-- Hand shape -->
                    <path class="hand-shape" d="M 100 350 L 100 180 C 105 160, 125 150, 150 152 C 170 153, 180 165, 182 180 L 185 220 C 185 220, 192 190, 198 175 C 204 160, 225 148, 250 155 C 270 160, 275 175, 275 195 L 265 260 C 360 258, 380 320, 375 360 C 370 410, 315 445, 270 450 L 140 450 C 95 440, 102 380, 100 350 Z"
                          fill="#E7C8FD" stroke="#DDB8ED"/>
                    <!-- Face -->
                    <circle class="face" cx="220" cy="300" r="50"/>
                    <circle class="face" cx="145" cy="300" r="50"/>
                    <!-- Eyes -->
                    <circle class="eye" cx="210" cy="295" r="12"/>
                    <circle class="eye" cx="140" cy="295" r="12"/>
                    <!-- Smile -->
                    <path class="mouth" d="M 140 330 Q 175 350, 230 330"/>
                </svg>
            </div>

            <!-- Orange Hand Character -->
            <div class="character-box orange">
                <svg class="hand" viewBox="0 0 400 500">
                    <!-- Hand shape -->
                    <path class="hand-shape" d="M 320 400 L 320 180 C 320 175, 318 170, 315 165 C 305 150, 290 148, 280 148 C 250 147, 235 170, 232 190 L 232 220 C 232 225, 228 230, 222 230 L 180 230 C 150 232, 142 260, 142 280 L 142 360 C 140 395, 165 415, 182 421 L 300 421 C 310 421, 320 415, 320 400 Z"
                          fill="#FDA549" stroke="#ED9539"/>
                    <!-- Face -->
                    <circle class="face" cx="230" cy="290" r="55"/>
                    <!-- Eyes -->
                    <circle class="eye" cx="220" cy="285" r="13"/>
                    <circle class="eye" cx="180" cy="290" r="10"/>
                    <!-- Frown -->
                    <path class="mouth" d="M 230 330 Q 210 318, 195 325"/>
                </svg>
            </div>
        </div>
    </div>

    <button class="restart-btn" onclick="location.reload()">↻ Restart Animation</button>
</body>
</html>
