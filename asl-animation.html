<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Page Transition Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ECE7E5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .animation-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Frame 1 - SIGN Letters */
        .frame-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            animation: fadeOutFrame1 0.5s ease-in-out 2.5s forwards;
        }

        .frame-1 svg {
            width: 90%;
            max-width: 1200px;
            height: auto;
        }

        @keyframes fadeOutFrame1 {
            to {
                opacity: 0;
                transform: scale(1.2);
            }
        }

        /* Frame 2 - Three Characters */
        .frame-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeInFrame2 0.5s ease-in-out 2.5s forwards;
        }

        .frame-2 svg {
            width: 90%;
            max-width: 1200px;
            height: auto;
        }

        @keyframes fadeInFrame2 {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Restart Button */
        .restart-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 18px 40px;
            background-color: #252525;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .restart-btn:hover {
            background-color: #444;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .restart-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
