<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Pages Frame Transition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ECE7E5;
            overflow: hidden;
        }

        .svg-viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-container {
            width: 2075px;
            height: 1117px;
            position: absolute;
            transform: scale(1);
            animation: panToFrame2 3s ease-in-out 2.5s forwards;
        }

        @keyframes panToFrame2 {
            0% {
                /* Show Frame 1 - top of SVG */
                transform: translateY(0) scale(1);
            }
            100% {
                /* Show Frame 2 - shift down to y=1313 */
                transform: translateY(-1313px) scale(1);
            }
        }

        .svg-container object,
        .svg-container embed {
            width: 2075px;
            height: 19996px;
            display: block;
            pointer-events: none;
        }

        /* Responsive scaling */
        @media (max-width: 2075px) {
            .svg-container {
                transform-origin: top center;
            }

            @keyframes panToFrame2 {
                0% {
                    transform: translateY(0) scale(0.9);
                }
                100% {
                    transform: translateY(-1313px) scale(0.9);
                }
            }
        }

        @media (max-width: 1800px) {
            @keyframes panToFrame2 {
                0% {
                    transform: translateY(0) scale(0.8);
                }
                100% {
                    transform: translateY(-1050px) scale(0.8);
                }
            }
        }

        @media (max-width: 1400px) {
            @keyframes panToFrame2 {
                0% {
                    transform: translateY(0) scale(0.6);
                }
                100% {
                    transform: translateY(-788px) scale(0.6);
                }
            }
        }

        /* Restart Button */
        .restart-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 18px 40px;
            background-color: #252525;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .restart-btn:hover {
            background-color: #444;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #252525;
            font-size: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading ASL Pages...</div>

    <div class="svg-viewport">
        <div class="svg-container">
            <object id="svgObject" data="asl-pages.svg" type="image/svg+xml">
                <embed src="asl-pages.svg" type="image/svg+xml" />
            </object>
        </div>
    </div>

    <button class="restart-btn" onclick="location.reload()">↻ Restart</button>

    <script>
        // Hide loading message once SVG loads
        const svgObject = document.getElementById('svgObject');
        svgObject.addEventListener('load', function() {
            document.getElementById('loading').style.display = 'none';
        });

        // Fallback: hide loading after 2 seconds
        setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
        }, 2000);
    </script>
</body>
</html>
