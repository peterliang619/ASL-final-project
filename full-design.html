<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Full Design - All Frames</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ECE7E5;
            overflow-x: hidden;
        }

        .page-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .svg-embed {
            width: 100vw;
            height: auto;
            display: block;
        }

        .svg-embed object,
        .svg-embed embed,
        .svg-embed iframe {
            width: 100%;
            height: auto;
            min-height: 100vh;
            border: none;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .controls button {
            padding: 10px 20px;
            margin: 5px;
            background: #252525;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .controls button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="location.href='asl-animation.html'">View Animation</button>
        <button onclick="location.href='index.html'">Simple Version</button>
    </div>

    <div class="page-container">
        <div class="svg-embed">
            <object data="asl-pages.svg" type="image/svg+xml" style="width:100%; height:auto;">
                <embed src="asl-pages.svg" type="image/svg+xml" style="width:100%; height:auto;" />
                <p style="padding: 40px; text-align: center;">
                    Your browser doesn't support SVG embedding.<br>
                    <a href="asl-pages.svg" download style="color: #252525; font-weight: 600;">Download the SVG file</a>
                </p>
            </object>
        </div>
    </div>
</body>
</html>
